name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee build.log

      - name: Report build errors on the commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Build failed"
            echo '```'
            grep -nE "^e: |error:|What went wrong|Could not|FAILED|Exception|> " build.log | head -120
            echo '```'
            echo '<details><summary>Last 80 lines</summary>'
            echo
            echo '```'
            tail -80 build.log
            echo '```'
            echo '</details>'
          } > report.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@report.md

      - name: Publish APK as a release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk gesturekey.apk
          gh release create "build-${{ github.run_number }}" gesturekey.apk \
            --title "GestureKey build ${{ github.run_number }}" \
            --notes "Debug APK built from ${{ github.sha }}. Install on Android: open gesturekey.apk and allow installing from this source." \
            --latest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
